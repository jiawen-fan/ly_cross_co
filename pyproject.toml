[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lya-co"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
io = ["h5py", "matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
